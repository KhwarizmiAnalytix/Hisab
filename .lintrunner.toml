    """,
    '--',
    '@{{PATHSFILE}}'
]

[[linter]]
code = 'BAZEL_LINTER'
# The repo has no plain WORKSPACE file — it uses MODULE.bazel / WORKSPACE.bazel
# plus *.bzl under Library/. http_archive (what this adapter checks) can appear
# in any of them.
include_patterns = ['**/WORKSPACE', '**/WORKSPACE.bazel', '**/MODULE.bazel', '**/*.bzl']
exclude_patterns = [
    'ThirdParty/**',
]
command = [
    'python3',
    'Tools/linter/adapters/bazel_linter.py',
    '--binary=.lintbin/bazel',
    '--',
    '@{{PATHSFILE}}'
]
init_command = [
    'python3',
    'Tools/linter/adapters/s3_init.py',
    '--config-json=Tools/linter/adapters/s3_init_config.json',
    '--linter=bazel',
    '--dry-run={{DRYRUN}}',
    '--output-dir=.lintbin',
    '--output-name=bazel',
]

[[linter]]
code = 'LINTRUNNER_VERSION'
include_patterns = ['**']
exclude_patterns = [
    'ThirdParty/**',
    '**/experimental/**',
    '**/Experimental/**',
    'Tools/**',
    '.vscode/**',
    '.git/**',
    '.augment/**',
]
command = [
    'python3',
    'Tools/linter/adapters/lintrunner_version_linter.py'
]

[[linter]]
code = 'RUFF'
include_patterns = [
    '**/*.py',
    '**/*.pyi',
    '**/*.ipynb',
    'pyproject.toml',
]
exclude_patterns = [
    'ThirdParty/**',
    '**/experimental/**',
    '**/Experimental/**',
    'Tools/**',
    '.vscode/**',
    '.git/**',
    '.augment/**',
]
command = [
    'python3',
    'Tools/linter/adapters/ruff_linter.py',
    '--config=pyproject.toml',
    '--show-disable',
    '--',
    '@{{PATHSFILE}}'
]
init_command = [
    'python3',
    'Tools/linter/adapters/pip_init.py',
    '--dry-run={{DRYRUN}}',
    'ruff==0.13.1',  # sync with PYFMT
]
is_formatter = true

[[linter]]
code = 'DOCSTRING_LINTER'
command = [
    'python3',
    'Tools/linter/adapters/docstring_linter.py',
    '--lintrunner',
    '--',
    '@{{PATHSFILE}}'
]
include_patterns = [
   'Scripts/**/*.py',
]
exclude_patterns = [
    'Scripts/setup.py',
    'Scripts/iwyu/run_iwyu_analysis.py',
]
is_formatter = false

[[linter]]
code = 'IMPORT_LINTER'
command = [
    'python3',
    'Tools/linter/adapters/import_linter.py',
    '--',
    '@{{PATHSFILE}}'
]
include_patterns = [
   'Scripts/**/*.py',
]
is_formatter = false

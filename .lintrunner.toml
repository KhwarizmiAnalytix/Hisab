[[linter]]
code = 'EDITORCONFIG'
# Verifies .editorconfig via editorconfig-checker. Disable/Exclude policy lives
# in .editorconfig-checker.json (IndentSize / trailing WS / final newline are
# off there — SPACES / NEWLINE own those).
include_patterns = ['**']
exclude_patterns = [
    'ThirdParty/**',
    '**/experimental/**',
    '**/Experimental/**',
    '**/generated/**',
    'build/**',
    'build_*/**',
    'dist/**',
    '.lintbin/**',
    'venv/**',
    '.venv/**',
    'Tools/**',
    '.vscode/**',
    '.cursor/**',
    '.git/**',
    '.augment/**',
    '**/*.png',
    '**/*.jpg',
    '**/*.jpeg',
    '**/*.gif',
    '**/*.ico',
    '**/*.pdf',
    '**/*.gz',
    '**/*.zip',
    '**/*.so',
    '**/*.dylib',
    '**/*.dll',
    '**/*.a',
    '**/*.lib',
    '**/*.o',
    '**/*.obj',
    '**/*.pyc',
    '**/*.pyd',
    '**/*.whl',
    '**/*.parquet',
    '**/*.bin',
    '**/*.pt',
    '**/*.onnx',
    '**/.DS_Store',
    '.dmypy.json',
]
command = [
    'python3',
    'Tools/linter/adapters/editorconfig_checker_linter.py',
    '--config=.editorconfig-checker.json',
    '--',
    '@{{PATHSFILE}}',
]
init_command = [
    'python3',
    'Tools/linter/adapters/pip_init.py',
    '--dry-run={{DRYRUN}}',
    'editorconfig-checker==3.8.0',
]


[[linter]]
code = 'CLANGTIDY'
include_patterns = [
    'Library/**/*.h',
    'Library/**/*.hxx',
    'Library/**/*.cpp',
]
exclude_patterns = [
    'ThirdParty/**',
    '**/experimental/**',
    '**/Experimental/**',
    '**/generated/**',
    '**/*pb.h',
    '**/*inl.h',
    'Tools/**',
    '.vscode/**',
    '.git/**',
    '.augment/**',
    # Test trees are excluded entirely — sources AND headers (previously only
    # *.cpp was excluded, which still clang-tidy-checked headers like
    # MemoryTest.h while skipping their test files).
    'Library/**/Testing/**/*.cpp',
    'Library/**/Testing/**/*.h',
]
init_command = [
    'python3',
    'Tools/linter/adapters/s3_init.py',
    '--config-json=Tools/linter/adapters/s3_init_config.json',
    '--linter=clang-tidy',
    '--dry-run={{DRYRUN}}',
    '--output-dir=.lintbin',
    '--output-name=clang-tidy',
]
command = [
    'python3',
    'Tools/linter/adapters/clangtidy_linter.py',
    '--binary=.lintbin/clang-tidy',
    '--build_dir=./build_ninja',
    '--',
    '@{{PATHSFILE}}'
]

[[linter]]
code = 'TYPEIGNORE'
include_patterns = ['**/*.py', '**/*.pyi']
exclude_patterns = [
    'ThirdParty/**',
    '**/experimental/**',
    '**/Experimental/**',
    'Tools/**',
    '.vscode/**',
    '.git/**',
    '.augment/**',
]
command = [
    'python3',
    'Tools/linter/adapters/grep_linter.py',
    '--pattern=# type:\s*ignore([^\[]|$)',
    '--linter-name=TYPEIGNORE',
    '--error-name=unqualified type: ignore',
    """--error-description=\
        This line has an unqualified `type: ignore`; \
        please convert it to `type: ignore[xxxx]`\
    """,
    '--',
    '@{{PATHSFILE}}'
]

[[linter]]
code = 'TYPENOSKIP'
include_patterns = ['mypy.ini']
command = [
    'python3',
    'Tools/linter/adapters/grep_linter.py',
    '--pattern=follow_imports\s*=\s*skip',
    '--linter-name=TYPENOSKIP',
    '--error-name=use of follow_imports = skip',
    """--error-description=\
        follow_imports = skip is forbidden from mypy.ini configuration as it \
        is extremely easy to accidentally turn off type checking unintentionally.  If \
        you need to suppress type errors, use a top level # mypy: ignore-errors.  \
        Do not rely on automatic Any substitution; instead, manually # type: ignore \
        at use sites or define a pyi type stub with more relaxed types. \
    """,
    '--',
    '@{{PATHSFILE}}'
]


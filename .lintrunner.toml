[[linter]]
code = 'CLANGFORMAT'
# Covers every C/C++/CUDA/ObjC++ extension present in Library/ (.mm = Metal
# allocators, .cu/.cuh = CUDA, .cxx). The .metal shader sources are excluded
# deliberately — clang-format has no Metal shading language mode.
include_patterns = [
    '**/*.h',
    '**/*.hxx',
    '**/*.cpp',
    '**/*.cxx',
    '**/*.cu',
    '**/*.cuh',
    '**/*.mm',
]
exclude_patterns = [
    'ThirdParty/**',
    '**/experimental/**',
    '**/Experimental/**',
    '.lintrunner.toml',
    '.vscode/**',
    '.git/**',
    '.augment/**',
]
init_command = [
    'python3',
    'Tools/linter/adapters/s3_init.py',
    '--config-json=Tools/linter/adapters/s3_init_config.json',
    '--linter=clang-format',
    '--dry-run={{DRYRUN}}',
    '--output-dir=.lintbin',
    '--output-name=clang-format',
]
command = [
    'python3',
    'Tools/linter/adapters/clangformat_linter.py',
    '--binary=.lintbin/clang-format',
    '--',
    '@{{PATHSFILE}}'
]
is_formatter = true


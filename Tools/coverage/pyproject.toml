[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage-tool"
version = "1.0.0"
description = "Multi-compiler (GCC/Clang/MSVC) C++ code coverage report generator"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
coverage-tool = "coverage_tool.run_coverage:main"
coverage-tool-html = "coverage_tool.html_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"coverage_tool.html_report" = ["custom.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
